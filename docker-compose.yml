# Profiles: mlops, llmops, observability — e.g. `docker compose --profile mlops up -d`.
services:
  # Image tags pinned to verified releases, not `latest`, for reproducible builds.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.1  # matches mlflow==3.15.1 in the Python lock files
    container_name: ai-delivery-portal-mlflow
    command: mlflow server --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    environment:
      # MLflow 3.x's DNS-rebinding protection (mlflow/server/security_utils.py)
      # rejects any request whose Host header isn't localhost/127.0.0.1 by
      # default — 403s every call from a container reaching this service via
      # host.docker.internal (e.g. an OpenChoreo Component/Workload on the
      # k3d cluster) with "Invalid Host header". Add that hostname here
      # rather than in code — this is server-side config, not a client bug.
      # Exact-string match unless the entry itself contains "*"
      # (mlflow/server/security_utils.py's is_allowed_host_header) — every
      # entry needs a bare form AND a ":*" form, since a Host header always
      # includes the port (localhost:5000, host.docker.internal:5000).
      # Setting this env var at all REPLACES get_default_allowed_hosts()'s
      # own localhost/127.0.0.1/private-IP defaults, not adds to them — the
      # first cut of this fix only added host.docker.internal's forms and
      # broke tests/test_prompts_router.py (a host pytest process, calling
      # via plain http://localhost:5000) as a result.
      MLFLOW_SERVER_ALLOWED_HOSTS: "localhost,localhost:*,127.0.0.1,127.0.0.1:*,host.docker.internal,host.docker.internal:*"
    profiles: ["mlops"]

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: ai-delivery-portal-prometheus
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:13.2.0
    container_name: ai-delivery-portal-grafana
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3001:3000"  # host 3001 — the Portal frontend (separate repo) dev server typically runs on 3000
    depends_on:
      - prometheus
    profiles: ["observability"]

  qdrant:
    image: qdrant/qdrant:v1.19.0  # matches qdrant-client==1.19.0 in the Python lock files
    container_name: ai-delivery-portal-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    profiles: ["llmops"]

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: ai-delivery-portal-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"  # S3 API — DVC remote (.dvc/config) points here for local dev
      - "9001:9001"  # web console
    profiles: ["mlops"]

  litellm:
    image: ghcr.io/berriai/litellm:main-v1.66.0-stable
    container_name: ai-delivery-portal-litellm
    command: --config /app/config.yaml --port 4000
    volumes:
      - ./infra/llm-gateways/litellm-config.yaml:/app/config.yaml:ro
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev}
    ports:
      - "4000:4000"
    profiles: ["llmops"]

  orchestration-api:
    build:
      context: .
      dockerfile: services/orchestration-api/Dockerfile
    container_name: ai-delivery-portal-orchestration-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      AUTH_ENABLED: "true"
      THUNDER_URL: http://thunder.openchoreo.localhost:8080
      MLFLOW_TRACKING_URI: http://mlflow:5000
      LITELLM_GATEWAY_URL: http://litellm:4000
      QDRANT_URL: http://qdrant:6333
    # thunder.openchoreo.localhost is OpenChoreo's k3d gateway hostname —
    # resolves to loopback automatically on the host (RFC 6761 .localhost),
    # but inside this container needs an explicit route to the real host
    # machine (Docker's host-gateway alias) since that auto-resolution
    # isn't guaranteed in every container's resolver config.
    extra_hosts:
      - "thunder.openchoreo.localhost:host-gateway"
    depends_on:
      - mlflow
    profiles: ["mlops"]

  observability-server:
    build:
      context: .
      dockerfile: agents/mcp-servers/observability-server/Dockerfile
    container_name: ai-delivery-portal-observability-server
    ports:
      - "9001:9001"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PROMETHEUS_URL: http://prometheus:9090
      LITELLM_GATEWAY_URL: http://litellm:4000
      ORCHESTRATION_API_URL: http://orchestration-api:8000
    # mlflow/prometheus/litellm/orchestration-api are different profiles —
    # start them first if needed (no depends_on: this server's tools each
    # degrade independently, same as query_metric already did against
    # Prometheus, not an all-or-nothing service).
    profiles: ["mlops", "llmops", "observability"]

  golden-paths-server:
    build:
      context: .
      dockerfile: agents/mcp-servers/golden-paths-server/Dockerfile
    container_name: ai-delivery-portal-golden-paths-server
    ports:
      - "9002:9002"
    environment:
      ORCHESTRATION_API_URL: http://orchestration-api:8000
      THUNDER_URL: http://thunder.openchoreo.localhost:8080
      THUNDER_CLIENT_ID: golden-paths-agent
      THUNDER_CLIENT_SECRET: golden-paths-agent-dev-secret
    extra_hosts:
      - "thunder.openchoreo.localhost:host-gateway"
    # orchestration-api is a different profile — start it first.
    profiles: ["llmops"]
