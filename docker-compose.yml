# Profiles: mlops, llmops, observability — e.g. `docker compose --profile mlops up -d`.
services:
  # Image tags pinned to verified releases, not `latest`, for reproducible builds.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.1  # matches mlflow==3.15.1 in the Python lock files
    container_name: ai-delivery-portal-mlflow
    command: mlflow server --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    environment:
      # MLflow 3.x rejects any request whose Host header isn't localhost by
      # default (DNS-rebinding protection) — 403s callers reaching it via
      # host.docker.internal. Setting this replaces the defaults entirely,
      # so every host needs both a bare and a ":*" form.
      MLFLOW_SERVER_ALLOWED_HOSTS: "localhost,localhost:*,127.0.0.1,127.0.0.1:*,host.docker.internal,host.docker.internal:*,mlflow,mlflow:*"
    profiles: ["mlops"]

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: ai-delivery-portal-prometheus
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:13.2.0
    container_name: ai-delivery-portal-grafana
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3001:3000"  # host 3001 — the Portal frontend (separate repo) dev server typically runs on 3000
    depends_on:
      - prometheus
    profiles: ["observability"]

  qdrant:
    image: qdrant/qdrant:v1.19.0  # matches qdrant-client==1.19.0 in the Python lock files
    container_name: ai-delivery-portal-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    profiles: ["llmops"]

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: ai-delivery-portal-minio
    command: server /data --console-address ":9091"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"  # S3 API — DVC remote (.dvc/config) points here for local dev
      - "9091:9091"  # web console — 9001 is taken by observability-server (MCP)
    profiles: ["mlops"]

  litellm:
    # Bumped from main-v1.66.0-stable: that pin dropped `tool_calls` for
    # the ollama_chat/ provider (BerriAI/litellm#19742 — tool-call intent
    # came back as raw JSON text in `content` instead of a structured
    # `tool_calls` field). Fixed upstream by BerriAI/litellm#40611 (native
    # tool calling for ollama/ models). 1.99.1 is also litellm's new bare
    # SemVer tag scheme (no more "-stable" suffix, see their "cleaner
    # release versions" post) — pin a specific version, not :latest, so
    # this stays reproducible.
    image: ghcr.io/berriai/litellm:1.99.1
    container_name: ai-delivery-portal-litellm
    command: --config /app/config.yaml --port 4000
    volumes:
      - ./infra/llm-gateways/litellm-config.yaml:/app/config.yaml:ro
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev}
    ports:
      - "4000:4000"
    profiles: ["llmops"]

  orchestration-api:
    build:
      context: .
      dockerfile: services/orchestration-api/Dockerfile
    container_name: ai-delivery-portal-orchestration-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Was hardcoded "true" here, overriding .env's AUTH_ENABLED=false and
      # 401'ing every protected route (nothing forwards a Thunder token
      # with the right audience yet). Removed to respect .env's local-dev
      # bypass; re-add once real end-to-end Thunder auth is wired.
      THUNDER_URL: http://thunder.openchoreo.localhost:8080
      MLFLOW_TRACKING_URI: http://mlflow:5000
      LITELLM_GATEWAY_URL: http://litellm:4000
      QDRANT_URL: http://qdrant:6333
      # .env's MINIO_ENDPOINT_URL default (localhost:9000) is host-oriented —
      # inside this container "localhost" is itself, not the minio service.
      MINIO_ENDPOINT_URL: http://minio:9000
      # Argo Server's k3d LoadBalancer publishes to a host port, not a
      # docker-compose service — reach it via the host, not a service name.
      ARGO_SERVER_URL: http://host.docker.internal:10081
      # .env has no BACKSTAGE_BASE_URL override, so this fell back to
      # core/config.py's "localhost:7007" default — inside this container
      # that's itself, not the host machine running `yarn start`. Silently
      # broken since catalog_client.py never raises, just logs a warning
      # and degrades (MCP discovery, and now golden-paths lookup, both
      # depend on this working).
      BACKSTAGE_BASE_URL: http://host.docker.internal:7007
      # This service's own identity when calling out to golden-paths-server
      # (mcp_client.py/mcp_auth_client.py) — needs registering by hand in
      # Thunder first, same prerequisite as golden-paths-agent below.
      MCP_CLIENT_ID: orchestration-api-agent
      MCP_CLIENT_SECRET: orchestration-api-agent-dev-secret
    # Routes the k3d gateway hostname to the real host machine — its
    # auto-loopback resolution isn't guaranteed inside a container.
    extra_hosts:
      - "thunder.openchoreo.localhost:host-gateway"
    # Lets LocalFileObjectStorageAdapter list the same DVC-checked-out
    # sample datasets a host-run `make run-orchestration-api` sees, without
    # needing the mlops-datasets MinIO bucket populated first. Read-only —
    # this adapter only ever lists files, never writes.
    #
    # Mounted a second time at /mnt/data — the SAME path the k3d training
    # pod reads from (train-register-template.yaml's hostPath, synced via
    # `docker cp`, see top-level README.md) — because
    # LocalFileObjectStorageAdapter's returned `uri` always uses that path
    # (so it's valid for the training pod once TASK_TYPE_THRESHOLDS steps
    # hand it off), not /app/data. Without this, GET /datasets/validate,
    # /datasets/columns, /datasets/preview here 404/500 on any
    # LocalFileObjectStorageAdapter-sourced dataset_uri, even though the
    # exact same file is sitting right there at /app/data.
    volumes:
      - ./data:/app/data:ro
      - ./data:/mnt/data:ro
    depends_on:
      - mlflow
      - minio
    profiles: ["mlops"]

  observability-server:
    build:
      context: .
      dockerfile: agents/mcp-servers/observability-server/Dockerfile
    container_name: ai-delivery-portal-observability-server
    ports:
      - "9001:9001"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PROMETHEUS_URL: http://prometheus:9090
      LITELLM_GATEWAY_URL: http://litellm:4000
      ORCHESTRATION_API_URL: http://orchestration-api:8000
    # mlflow/prometheus/litellm/orchestration-api are different profiles —
    # start them first if needed (no depends_on: this server's tools each
    # degrade independently, same as query_metric already did against
    # Prometheus, not an all-or-nothing service).
    profiles: ["mlops", "llmops", "observability"]

  golden-paths-server:
    build:
      context: .
      dockerfile: agents/mcp-servers/golden-paths-server/Dockerfile
    container_name: ai-delivery-portal-golden-paths-server
    ports:
      - "9002:9002"
    environment:
      ORCHESTRATION_API_URL: http://orchestration-api:8000
      THUNDER_URL: http://thunder.openchoreo.localhost:8080
      THUNDER_CLIENT_ID: golden-paths-agent
      THUNDER_CLIENT_SECRET: golden-paths-agent-dev-secret
      # This server's own resource identifier (AuthSettings.resource_server_url).
      MCP_SERVER_URL: http://golden-paths-server:9002/mcp
      # client_ids allowed to call this server's MCP endpoint at all — Thunder's
      # client_credentials tokens carry aud == the caller's own client_id (no
      # separate "resource" audience), so this is an allowlist, not one fixed
      # audience string. Defaults to just orchestration-api-agent already.
      THUNDER_MCP_ALLOWED_CLIENTS: orchestration-api-agent
    extra_hosts:
      - "thunder.openchoreo.localhost:host-gateway"
    # orchestration-api is a different profile — start it first.
    profiles: ["llmops"]

  golden-path-guide-server:
    build:
      context: .
      dockerfile: agents/mcp-servers/golden-path-guide-server/Dockerfile
    container_name: ai-delivery-portal-golden-path-guide-server
    ports:
      - "9003:9003"
    environment:
      ORCHESTRATION_API_URL: http://orchestration-api:8000
    # orchestration-api is a different profile — start it first.
    profiles: ["mlops", "llmops"]
