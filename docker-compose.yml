# Profiles: mlops, llmops, observability — e.g. `docker compose --profile mlops up -d`.
services:
  # Image tags pinned to verified releases, not `latest`, for reproducible builds.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.1  # matches mlflow==3.15.1 in the Python lock files
    container_name: ai-delivery-portal-mlflow
    # --default-artifact-root: artifacts land in MinIO as real s3:// URIs
    # KServe's storage-initializer can read — NOT --artifacts-destination,
    # which only works with --serve-artifacts and hides real paths behind an
    # mlflow-artifacts:/ proxy. Needs the `mlflow-artifacts` bucket in MinIO
    # (`mc mb`, run once by hand). Applies only to experiments created after
    # server start, but the DB is recreated every boot anyway.
    #
    # `pip install boto3` first: the mlflow image has no S3 support; re-installs
    # every container start since site-packages isn't persisted.
    entrypoint: sh -c
    command:
      - >-
        pip install --quiet boto3 &&
        mlflow server --host 0.0.0.0 --port 5000
        --no-serve-artifacts --default-artifact-root s3://mlflow-artifacts
    ports:
      - "5000:5000"
    environment:
      # MLflow 3.x blocks non-localhost Host headers (DNS-rebinding protection),
      # 403'ing requests via host.docker.internal. Replaces the defaults, so
      # every host needs both a bare and a ":*" form.
      MLFLOW_SERVER_ALLOWED_HOSTS: "localhost,localhost:*,127.0.0.1,127.0.0.1:*,host.docker.internal,host.docker.internal:*,mlflow,mlflow:*"
      # boto3 (MLflow's S3 client) reads these — same creds as minio/DVC.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      # Same-network service name — no host.docker.internal inside compose
      # (only needed for callers outside, e.g. k3d or a separate container).
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      - minio
    profiles: ["mlops"]

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: ai-delivery-portal-prometheus
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:13.2.0
    container_name: ai-delivery-portal-grafana
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3001:3000"  # host 3001 — the Portal frontend (separate repo) dev server typically runs on 3000
    depends_on:
      - prometheus
    profiles: ["observability"]

  qdrant:
    image: qdrant/qdrant:v1.19.0  # matches qdrant-client==1.19.0 in the Python lock files
    container_name: ai-delivery-portal-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    profiles: ["llmops"]

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: ai-delivery-portal-minio
    command: server /data --console-address ":9091"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"  # S3 API — DVC remote (.dvc/config) points here for local dev
      - "9091:9091"  # web console — 9001 is taken by observability-server (MCP)
    profiles: ["mlops"]

  litellm:
    # 1.99.1, not main-v1.66.0-stable: that pin dropped `tool_calls` for
    # ollama_chat/ (litellm#19742), fixed in #40611. Pin, don't use :latest.
    image: ghcr.io/berriai/litellm:1.99.1
    container_name: ai-delivery-portal-litellm
    command: --config /app/config.yaml --port 4000
    volumes:
      - ./infra/llm-gateways/litellm-config.yaml:/app/config.yaml:ro
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev}
    ports:
      - "4000:4000"
    profiles: ["llmops"]

  orchestration-api:
    build:
      context: .
      dockerfile: services/orchestration-api/Dockerfile
    container_name: ai-delivery-portal-orchestration-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Was hardcoded "true", 401'ing every protected route (no Thunder token
      # forwarded yet). Removed to respect .env's AUTH_ENABLED=false.
      THUNDER_URL: http://thunder.openchoreo.localhost:8080
      MLFLOW_TRACKING_URI: http://mlflow:5000
      LITELLM_GATEWAY_URL: http://litellm:4000
      QDRANT_URL: http://qdrant:6333
      # .env default (localhost:9000) is host-oriented — in-container
      # "localhost" is itself, not the minio service.
      MINIO_ENDPOINT_URL: http://minio:9000
      # MLflow's own S3 client (register_model reads artifacts from S3), distinct
      # from MINIO_ENDPOINT_URL (MinioObjectStorageAdapter's boto3). Missing it
      # 403'd with MinIO creds against real AWS.
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      # .env has no override, so core/config.py's localhost:7007 pointed the
      # container at itself — silently broken since catalog_client.py just logs.
      BACKSTAGE_BASE_URL: http://host.docker.internal:7007
      # Our identity when calling the golden-paths MCP servers — register by hand
      # in Thunder first.
      MCP_CLIENT_ID: orchestration-api-agent
      MCP_CLIENT_SECRET: orchestration-api-agent-dev-secret
      # Same host-gateway routing as THUNDER_URL — openchoreo-api is only
      # reachable through the k3d gateway's external hostname.
      OPENCHOREO_API_URL: http://api.openchoreo.localhost:8080/api/v1
    # k3d gateway hostnames -> real host machine; auto-loopback isn't guaranteed
    # inside a container.
    extra_hosts:
      - "thunder.openchoreo.localhost:host-gateway"
      - "api.openchoreo.localhost:host-gateway"
    # Lets LocalFileObjectStorageAdapter list the DVC-checked-out datasets a
    # host-run API sees, no mlops-datasets bucket needed. Read-only.
    #
    # Mounted a second time at /mnt/data — the SAME path the k3d training pod
    # reads (its hostPath, synced via `docker cp`) — because the adapter's
    # returned `uri` always uses that path. Without it, /datasets/validate etc.
    # 404 on local-sourced dataset_uri, even though the file sits at /app/data.
    # OpenChoreo/KServe adapters call load_kube_config() with no args, reading
    # ~/.kube/config for the process user (appuser, uid 1000). This gitignored
    # copy swaps the k3d API URL 0.0.0.0:6550 -> host.docker.internal:6550 and
    # skips TLS verify (no such SAN on the k3d cert). Regenerate after recreating
    # the cluster: `kubectl config view --minify --flatten`, swap, add
    # insecure-skip-tls-verify.
    volumes:
      - ./data:/app/data:ro
      - ./data:/mnt/data:ro
      # /rag/ingest reads repo-relative source_paths (e.g.
      # docs/playbook-ai-delivery-portal.md) off the container filesystem;
      # without this every ingest 500s on FileNotFoundError.
      - ./docs:/app/docs:ro
      - ./services/orchestration-api/.state/kubeconfig-docker.yaml:/home/appuser/.kube/config:ro
    depends_on:
      - mlflow
      - minio
    profiles: ["mlops"]

  observability-server:
    build:
      context: .
      dockerfile: agents/mcp-servers/observability-server/Dockerfile
    container_name: ai-delivery-portal-observability-server
    ports:
      - "9001:9001"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PROMETHEUS_URL: http://prometheus:9090
      LITELLM_GATEWAY_URL: http://litellm:4000
      ORCHESTRATION_API_URL: http://orchestration-api:8000
    # Deps are in other profiles — start them first if needed (no depends_on;
    # this server's tools each degrade independently).
    profiles: ["mlops", "llmops", "observability"]

  llmops-golden-paths-server:
    build:
      context: .
      dockerfile: agents/mcp-servers/llmops-golden-paths-server/Dockerfile
    container_name: ai-delivery-portal-llmops-golden-paths-server
    ports:
      - "9002:9002"
    environment:
      ORCHESTRATION_API_URL: http://orchestration-api:8000
      THUNDER_URL: http://thunder.openchoreo.localhost:8080
      THUNDER_CLIENT_ID: llmops-golden-paths-agent
      THUNDER_CLIENT_SECRET: llmops-golden-paths-agent-dev-secret
      # This resource server's own identifier (AuthSettings.resource_server_url).
      MCP_SERVER_URL: http://llmops-golden-paths-server:9002/mcp
      # Allowlist of client ids allowed to call this MCP endpoint — Thunder's
      # tokens carry aud == the caller's own client_id, not one fixed audience.
      THUNDER_MCP_ALLOWED_CLIENTS: orchestration-api-agent
    extra_hosts:
      - "thunder.openchoreo.localhost:host-gateway"
    # orchestration-api is a different profile — start it first.
    profiles: ["llmops"]

  golden-path-guide-server:
    build:
      context: .
      dockerfile: agents/mcp-servers/golden-path-guide-server/Dockerfile
    container_name: ai-delivery-portal-golden-path-guide-server
    ports:
      - "9003:9003"
    environment:
      ORCHESTRATION_API_URL: http://orchestration-api:8000
    # orchestration-api is a different profile — start it first.
    profiles: ["mlops", "llmops"]

  mlops-golden-paths-server:
    build:
      context: .
      dockerfile: agents/mcp-servers/mlops-golden-paths-server/Dockerfile
    container_name: ai-delivery-portal-mlops-golden-paths-server
    ports:
      - "9004:9004"
    environment:
      ORCHESTRATION_API_URL: http://orchestration-api:8000
      THUNDER_URL: http://thunder.openchoreo.localhost:8080
      THUNDER_CLIENT_ID: mlops-golden-paths-agent
      THUNDER_CLIENT_SECRET: mlops-golden-paths-agent-dev-secret
      # This resource server's own identifier (AuthSettings.resource_server_url).
      MCP_SERVER_URL: http://mlops-golden-paths-server:9004/mcp
      # Same allowlist semantics as llmops-golden-paths-server.
      THUNDER_MCP_ALLOWED_CLIENTS: orchestration-api-agent
    extra_hosts:
      - "thunder.openchoreo.localhost:host-gateway"
    # orchestration-api is a different profile — start it first.
    profiles: ["mlops"]
