model_list:
  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
  # Embedding model for RAG ingest/evaluate (routers/rag.py, routers/chat.py)
  # — not a second chat model, see docs/llmops-lifecycle-plan.md mục 8 Q5.
  - model_name: voyage-3
    litellm_params:
      model: voyage/voyage-3
      api_key: os.environ/VOYAGE_API_KEY
  # Internal company inference gateway — reliable structured tool_calls
  # (verified: proper finish_reason="tool_calls", not JSON-in-content like
  # llama3.1-local below used to give). Actually routes to a MiniMax M3
  # deployment behind the "model-canary" alias — see its own /v1/models.
  # PORTAL_ASSISTANT_MODEL=model-canary in .env selects this for
  # routers/portal_assistant.py's chat loop.
  - model_name: model-canary
    litellm_params:
      model: openai/model-canary
      api_base: http://10.23.101.225:8085/v1
      api_key: os.environ/MODEL_CANARY_API_KEY
  # For working off the company network, where model-canary's internal
  # gateway above isn't reachable. Google AI Studio free tier — its free-tier
  # terms let Google use requests to improve their models, so keep real or
  # sensitive data out of it. PORTAL_ASSISTANT_MODEL=gemini-flash in .env
  # selects it; key goes in .env as GEMINI_API_KEY.
  # Pinned, not the gemini-flash-latest alias, so the model can't change
  # underneath a test run. gemini-2.5-flash was the first pick but Google
  # 404s it for new API keys ("no longer available to new users").
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
  # Free-tier models intermittently 503 with "experiencing high demand"
  # (observed on gemini-3.8-flash) — a sibling model is a separate capacity
  # pool, so it's the fallback below rather than just more retries.
  - model_name: gemini-flash-fallback
    litellm_params:
      model: gemini/gemini-3.7-flash
      api_key: os.environ/GEMINI_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

# When the Anthropic key has no credit (or is rate-limited), fall back to
# model-canary instead of 400'ing the whole chat.
#
# The local Ollama fallbacks (llama3.1-local, qwen2.5-local,
# nomic-embed-local) were retired: llama3.1:8b never reliably emitted
# structured tool_calls, and qwen2.5:7b did emit them but couldn't
# reliably chain the 3 sequential tool calls the golden-path draft flow
# needs (verified via routers/portal_assistant.py testing — it would stop
# after 1-2 calls with an empty final message, or hallucinate a
# differently-named tool instead of calling propose_golden_path_draft).
litellm_settings:
  # Retries transient upstream errors (e.g. a free-tier 503) before a
  # fallback kicks in or the chat turn fails.
  num_retries: 2
  fallbacks:
    - claude-sonnet-5: ["model-canary"]
    - gemini-flash: ["gemini-flash-fallback"]
