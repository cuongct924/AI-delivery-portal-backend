model_list:
  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
  # Embedding model for RAG ingest/evaluate (routers/rag.py, routers/chat.py)
  # — not a second chat model, see docs/llmops-lifecycle-plan.md mục 8 Q5.
  - model_name: voyage-3
    litellm_params:
      model: voyage/voyage-3
      api_key: os.environ/VOYAGE_API_KEY
  # Free, local, no API key — embedding fallback so RAG ingest/evaluate works
  # when VOYAGE_API_KEY is unset (same rationale as the local chat fallbacks
  # below). NOTE: 768-dim vs voyage-3's 1024 — a collection must stay on one
  # backend, since Qdrant fixes the vector size at creation.
  - model_name: nomic-embed-local
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://host.docker.internal:11434
  # Free, local, no API key — for testing when ANTHROPIC_API_KEY has no
  # credit. "ollama_chat/" (not "ollama/") is required for tool-calling:
  # it hits Ollama's /api/chat endpoint, which supports `tools`; the
  # legacy "ollama/" prefix uses /api/generate and silently drops them.
  # Reaches the host's `ollama serve` (:11434) — litellm runs in this
  # container, not on the host.
  - model_name: llama3.1-local
    litellm_params:
      model: ollama_chat/llama3.1:8b
      api_base: http://host.docker.internal:11434
  # llama3.1:8b (above) understands when to call a tool but doesn't
  # reliably emit litellm's structured `tool_calls` field — it just
  # writes the call as JSON text in `content` instead, which
  # routers/chat.py's tool loop never sees. qwen2.5 has more reliable
  # native tool-calling support in Ollama.
  - model_name: qwen2.5-local
    litellm_params:
      model: ollama_chat/qwen2.5:7b
      api_base: http://host.docker.internal:11434

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

# When the Anthropic key has no credit (or is rate-limited), fall back to the
# free local Ollama model instead of 400'ing the whole chat. qwen2.5-local is
# the tool-calling-capable one (see its note above).
litellm_settings:
  fallbacks:
    - claude-sonnet-5: ["qwen2.5-local"]
    - voyage-3: ["nomic-embed-local"]
