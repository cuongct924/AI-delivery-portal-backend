# DUPLICATE of infra/argo-workflows/train-register-template.yaml, kept in
# sync by hand — see this file's header there for why (Argo's
# workflowTemplateRef only resolves within the calling Workflow's own
# namespace; OpenChoreo's ClusterWorkflow mechanism runs every WorkflowRun
# in an auto-created `workflows-<namespaceName>` execution namespace, never
# `default`, so the namespace-scoped WorkflowTemplate used by "legacy"
# ArgoAdapter mode can't be referenced from there — only a cluster-scoped
# ClusterWorkflowTemplate can). Used by
# infra/openchoreo/fraud-detection/clusterworkflow-training.yaml
# ("openchoreo" backend mode only) — "legacy" mode keeps using the
# original WorkflowTemplate untouched.
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: train-register-golden-path-cluster
spec:
  entrypoint: train-and-register
  # workflow-sa, not train-register-workflow: OpenChoreo's workflow-plane
  # controller auto-provisions "workflow-sa" (+ the workflowtaskresults
  # create/patch Role it needs to report step outputs) in every
  # `workflows-<namespaceName>` execution namespace it creates — confirmed
  # against the real cluster (`kubectl get sa,role -n workflows-default`)
  # after triggering a real WorkflowRun. "train-register-workflow" only
  # exists in the `default` namespace (legacy mode's namespace), and
  # wouldn't exist in `workflows-<namespaceName>` for any namespaceName.
  serviceAccountName: workflow-sa
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  volumes:
    # hostPath into the k3d server node's filesystem (docker cp'd there —
    # see top-level README.md) — avoids S3/DVC-pull logic here.
    - name: dataset
      hostPath:
        path: /mnt/data
        type: Directory
  arguments:
    parameters:
      - name: model-name
      - name: dataset-uri
      - name: task-type
      # sklearn by default — mlp/lstm use dl_architecture_registry.py
      # instead and don't need `algorithm` at all.
      - name: architecture
        value: sklearn
      - name: algorithm
        value: ""
      # train from scratch unless the caller sets base-model-uri (see
      # routers/models.py trigger_training()).
      - name: mode
        value: train
      - name: target-column
        value: ""
      - name: id-columns
        value: ""
      - name: time-column
        value: ""
      - name: base-model-uri
        value: ""
      # DL hyperparameters — unused/empty for architecture=sklearn.
      - name: hidden-layers
        value: ""
      - name: dropout
        value: ""
      - name: sequence-length
        value: ""
      - name: num-layers
        value: ""
      - name: hidden-size
        value: ""
      - name: learning-rate
        value: ""
      - name: epochs
        value: ""
      - name: batch-size
        value: ""
      # Dev-facing optimizer choice (optimizers.py) — only used for
      # architecture=mlp/lstm/nlp/cv, defaults to "adam" when unset.
      - name: optimizer
        value: ""
      # BYOC — only used when algorithm=custom.
      - name: code-repo-url
        value: ""
      - name: entrypoint-path
        value: ""
      - name: custom-config
        value: "{}"
      # HPO — fixed by default, matches the original single-run behavior.
      - name: search-strategy
        value: fixed
      - name: num-trials
        value: ""
      - name: search-space-json
        value: "{}"
      - name: objective-metric
        value: ""
      - name: objective-direction
        value: maximize
      # NLP — only used when architecture=nlp.
      - name: text-column
        value: ""
      - name: base-model-name
        value: ""
  templates:
    - name: train-and-register
      dag:
        tasks:
          - name: train
            template: train-step
            arguments:
              parameters:
                - name: dataset-uri
                  value: '{{workflow.parameters.dataset-uri}}'
                - name: task-type
                  value: '{{workflow.parameters.task-type}}'
                - name: architecture
                  value: '{{workflow.parameters.architecture}}'
                - name: algorithm
                  value: '{{workflow.parameters.algorithm}}'
                - name: mode
                  value: '{{workflow.parameters.mode}}'
                - name: target-column
                  value: '{{workflow.parameters.target-column}}'
                - name: id-columns
                  value: '{{workflow.parameters.id-columns}}'
                - name: time-column
                  value: '{{workflow.parameters.time-column}}'
                - name: base-model-uri
                  value: '{{workflow.parameters.base-model-uri}}'
                - name: hidden-layers
                  value: '{{workflow.parameters.hidden-layers}}'
                - name: dropout
                  value: '{{workflow.parameters.dropout}}'
                - name: sequence-length
                  value: '{{workflow.parameters.sequence-length}}'
                - name: num-layers
                  value: '{{workflow.parameters.num-layers}}'
                - name: hidden-size
                  value: '{{workflow.parameters.hidden-size}}'
                - name: learning-rate
                  value: '{{workflow.parameters.learning-rate}}'
                - name: epochs
                  value: '{{workflow.parameters.epochs}}'
                - name: batch-size
                  value: '{{workflow.parameters.batch-size}}'
                - name: optimizer
                  value: '{{workflow.parameters.optimizer}}'
                - name: code-repo-url
                  value: '{{workflow.parameters.code-repo-url}}'
                - name: entrypoint-path
                  value: '{{workflow.parameters.entrypoint-path}}'
                - name: custom-config
                  value: '{{workflow.parameters.custom-config}}'
                - name: search-strategy
                  value: '{{workflow.parameters.search-strategy}}'
                - name: num-trials
                  value: '{{workflow.parameters.num-trials}}'
                - name: search-space-json
                  value: '{{workflow.parameters.search-space-json}}'
                - name: objective-metric
                  value: '{{workflow.parameters.objective-metric}}'
                - name: objective-direction
                  value: '{{workflow.parameters.objective-direction}}'
                - name: text-column
                  value: '{{workflow.parameters.text-column}}'
                - name: base-model-name
                  value: '{{workflow.parameters.base-model-name}}'
          - name: register
            template: register-step
            dependencies: [train]
            arguments:
              parameters:
                - name: model-name
                  value: '{{workflow.parameters.model-name}}'
                - name: task-type
                  value: '{{workflow.parameters.task-type}}'
                - name: artifact-uri
                  value: '{{tasks.train.outputs.parameters.artifact-uri}}'
                - name: dataset-digest
                  value: '{{tasks.train.outputs.parameters.dataset-digest}}'

    - name: train-step
      inputs:
        parameters:
          - name: dataset-uri
          - name: task-type
          - name: architecture
          - name: algorithm
          - name: mode
          - name: target-column
          - name: id-columns
          - name: time-column
          - name: base-model-uri
          - name: hidden-layers
          - name: dropout
          - name: sequence-length
          - name: num-layers
          - name: hidden-size
          - name: learning-rate
          - name: epochs
          - name: batch-size
          - name: optimizer
          - name: code-repo-url
          - name: entrypoint-path
          - name: custom-config
          - name: search-strategy
          - name: num-trials
          - name: search-space-json
          - name: objective-metric
          - name: objective-direction
          - name: text-column
          - name: base-model-name
      outputs:
        parameters:
          - name: artifact-uri
            valueFrom:
              path: /tmp/artifact-uri
          - name: dataset-digest
            valueFrom:
              path: /tmp/dataset-digest
      container:
        # Built from infra/argo-workflows/training-image/, deps baked in at
        # build time. Loaded into the local cluster's container runtime
        # (kind load / k3d image import) — never pushed to a registry.
        image: training-image:local
        imagePullPolicy: IfNotPresent
        # Explicit, matches the image's own CMD. Required: for a
        # registry-less local image, Argo's emissary executor otherwise
        # tries to look up the entrypoint by querying the image's registry
        # (defaults to docker.io/library/... when unqualified) and fails
        # with an UNAUTHORIZED manifest-pull error.
        command: ["python", "train.py"]
        env:
          - name: DATASET_URI
            value: '{{inputs.parameters.dataset-uri}}'
          - name: TASK_TYPE
            value: '{{inputs.parameters.task-type}}'
          - name: TARGET_COLUMN
            value: '{{inputs.parameters.target-column}}'
          - name: ID_COLUMNS
            value: '{{inputs.parameters.id-columns}}'
          - name: ARCHITECTURE
            value: '{{inputs.parameters.architecture}}'
          - name: ALGORITHM
            value: '{{inputs.parameters.algorithm}}'
          - name: MODE
            value: '{{inputs.parameters.mode}}'
          - name: BASE_MODEL_URI
            value: '{{inputs.parameters.base-model-uri}}'
          - name: TIME_COLUMN
            value: '{{inputs.parameters.time-column}}'
          - name: HIDDEN_LAYERS
            value: '{{inputs.parameters.hidden-layers}}'
          - name: DROPOUT
            value: '{{inputs.parameters.dropout}}'
          - name: SEQUENCE_LENGTH
            value: '{{inputs.parameters.sequence-length}}'
          - name: NUM_LAYERS
            value: '{{inputs.parameters.num-layers}}'
          - name: HIDDEN_SIZE
            value: '{{inputs.parameters.hidden-size}}'
          - name: LEARNING_RATE
            value: '{{inputs.parameters.learning-rate}}'
          - name: EPOCHS
            value: '{{inputs.parameters.epochs}}'
          - name: BATCH_SIZE
            value: '{{inputs.parameters.batch-size}}'
          - name: OPTIMIZER
            value: '{{inputs.parameters.optimizer}}'
          - name: CODE_REPO_URL
            value: '{{inputs.parameters.code-repo-url}}'
          - name: ENTRYPOINT_PATH
            value: '{{inputs.parameters.entrypoint-path}}'
          - name: CUSTOM_CONFIG
            value: '{{inputs.parameters.custom-config}}'
          - name: SEARCH_STRATEGY
            value: '{{inputs.parameters.search-strategy}}'
          - name: NUM_TRIALS
            value: '{{inputs.parameters.num-trials}}'
          - name: SEARCH_SPACE_JSON
            value: '{{inputs.parameters.search-space-json}}'
          - name: OBJECTIVE_METRIC
            value: '{{inputs.parameters.objective-metric}}'
          - name: OBJECTIVE_DIRECTION
            value: '{{inputs.parameters.objective-direction}}'
          - name: TEXT_COLUMN
            value: '{{inputs.parameters.text-column}}'
          - name: BASE_MODEL_NAME
            value: '{{inputs.parameters.base-model-name}}'
          - name: MLFLOW_TRACKING_URI
            value: http://host.docker.internal:5000
          # Kept in sync with train-register-template.yaml's own copy of
          # this block — see that file for why (mlflow-artifacts now
          # backed by real MinIO storage, --no-serve-artifacts).
          - name: AWS_ACCESS_KEY_ID
            value: minioadmin
          - name: AWS_SECRET_ACCESS_KEY
            value: minioadmin
          - name: MLFLOW_S3_ENDPOINT_URL
            value: http://host.docker.internal:9000
        volumeMounts:
          - name: dataset
            mountPath: /mnt/data
            readOnly: true

    - name: register-step
      inputs:
        parameters:
          - name: model-name
          - name: task-type
          - name: artifact-uri
          - name: dataset-digest
      container:
        image: python:3.12-slim
        command: [sh, -c]
        env:
          # pip --user needs a writable, resolvable HOME (UID 1000 has none).
          - name: HOME
            value: /tmp
        args:
          - |
            set -euo pipefail
            pip install --user -q httpx

            MODEL_NAME='{{inputs.parameters.model-name}}'
            TASK_TYPE='{{inputs.parameters.task-type}}'
            ARTIFACT_URI='{{inputs.parameters.artifact-uri}}'
            DATASET_DIGEST='{{inputs.parameters.dataset-digest}}'
            export MODEL_NAME TASK_TYPE ARTIFACT_URI DATASET_DIGEST

            python3 <<'PY'
            import os
            import sys

            import httpx

            model_name = os.environ["MODEL_NAME"]
            task_type = os.environ["TASK_TYPE"]
            artifact_uri = os.environ["ARTIFACT_URI"]
            dataset_digest = os.environ.get("DATASET_DIGEST") or None

            # Business logic stays in orchestration-api, not here — CLAUDE.md convention.
            response = httpx.post(
                "http://host.docker.internal:8000/models/register",
                json={
                    "name": model_name,
                    "artifact_uri": artifact_uri,
                    "task_type": task_type,
                    "dataset_version": dataset_digest,
                },
                timeout=30.0,
            )
            if response.is_error:
                # Exit non-zero so Argo marks this step Failed, not silently succeeds.
                print(f"model registration failed: {response.status_code} {response.text}", file=sys.stderr)
                sys.exit(1)

            print(response.json())
            PY
        volumeMounts:
          - name: dataset
            mountPath: /mnt/data
            readOnly: true
