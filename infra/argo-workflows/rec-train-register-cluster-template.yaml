# Cluster-scoped counterpart to infra/argo-workflows/rec-train-register-template.yaml,
# used by the "openchoreo" workflow backend (ClusterWorkflow
# rec-train-register-golden-path, see
# infra/openchoreo/telco-fraud-detection/clusterworkflow-rec-training.yaml).
#
# Why a cluster-scoped copy: OpenChoreo's ClusterWorkflow mechanism renders and
# applies every WorkflowRun in an auto-created `workflows-<namespaceName>`
# execution namespace, never `default` — so a namespace-scoped WorkflowTemplate
# can't be referenced from there, only a ClusterWorkflowTemplate (same reason
# train-register-cluster-template.yaml is cluster-scoped too).
#
# register-step is inlined here rather than `templateRef`-ing Golden Path #1's
# WorkflowTemplate (which rec-train-register-template.yaml used to do): Golden
# Path #1's legacy namespace-scoped template was removed, and a
# namespace-scoped templateRef wouldn't resolve from the OpenChoreo execution
# namespace anyway. Duplicated by hand, same convention as
# train-register-cluster-template.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: rec-train-register-golden-path-cluster
spec:
  entrypoint: train-and-register
  # workflow-sa, not train-register-workflow: OpenChoreo's workflow-plane
  # controller auto-provisions "workflow-sa" in every `workflows-<namespaceName>`
  # execution namespace it creates — see train-register-cluster-template.yaml.
  serviceAccountName: workflow-sa
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  volumes:
    - name: dataset
      hostPath:
        path: /mnt/data
        type: Directory
  arguments:
    parameters:
      - name: model-name
      - name: interactions-uri
      # Only required for algorithm=tfidf_cosine.
      - name: item-features-uri
        value: ""
      - name: user-id-column
      - name: item-id-column
      - name: timestamp-column
      # Required for algorithm=svd/knn (explicit feedback), unused otherwise.
      - name: rating-column
        value: ""
      # Both required together, only for algorithm=tfidf_cosine.
      - name: item-id-column-features
        value: ""
      - name: item-text-column
        value: ""
      - name: algorithm
      - name: k
        value: "10"
      # Free-form per-algorithm hyperparameters, same pattern as BYOC's customConfig.
      - name: hyperparameters-json
        value: "{}"
  templates:
    - name: train-and-register
      dag:
        tasks:
          - name: train
            template: rec-train-step
            arguments:
              parameters:
                - name: interactions-uri
                  value: '{{workflow.parameters.interactions-uri}}'
                - name: item-features-uri
                  value: '{{workflow.parameters.item-features-uri}}'
                - name: user-id-column
                  value: '{{workflow.parameters.user-id-column}}'
                - name: item-id-column
                  value: '{{workflow.parameters.item-id-column}}'
                - name: timestamp-column
                  value: '{{workflow.parameters.timestamp-column}}'
                - name: rating-column
                  value: '{{workflow.parameters.rating-column}}'
                - name: item-id-column-features
                  value: '{{workflow.parameters.item-id-column-features}}'
                - name: item-text-column
                  value: '{{workflow.parameters.item-text-column}}'
                - name: algorithm
                  value: '{{workflow.parameters.algorithm}}'
                - name: k
                  value: '{{workflow.parameters.k}}'
                - name: hyperparameters-json
                  value: '{{workflow.parameters.hyperparameters-json}}'
          - name: register
            template: register-step
            dependencies: [train]
            arguments:
              parameters:
                - name: model-name
                  value: '{{workflow.parameters.model-name}}'
                - name: task-type
                  value: ranking
                - name: artifact-uri
                  value: '{{tasks.train.outputs.parameters.artifact-uri}}'
                - name: dataset-digest
                  value: '{{tasks.train.outputs.parameters.dataset-digest}}'

    - name: rec-train-step
      inputs:
        parameters:
          - name: interactions-uri
          - name: item-features-uri
          - name: user-id-column
          - name: item-id-column
          - name: timestamp-column
          - name: rating-column
          - name: item-id-column-features
          - name: item-text-column
          - name: algorithm
          - name: k
          - name: hyperparameters-json
      outputs:
        parameters:
          - name: artifact-uri
            valueFrom:
              path: /tmp/artifact-uri
          - name: dataset-digest
            valueFrom:
              path: /tmp/dataset-digest
      container:
        # Same image as Golden Path #1 — train_rec.py is just 1 more .py file in it.
        image: training-image:local
        imagePullPolicy: IfNotPresent
        command: [python, train_rec.py]
        env:
          - name: INTERACTIONS_URI
            value: '{{inputs.parameters.interactions-uri}}'
          - name: ITEM_FEATURES_URI
            value: '{{inputs.parameters.item-features-uri}}'
          - name: USER_ID_COLUMN
            value: '{{inputs.parameters.user-id-column}}'
          - name: ITEM_ID_COLUMN
            value: '{{inputs.parameters.item-id-column}}'
          - name: TIMESTAMP_COLUMN
            value: '{{inputs.parameters.timestamp-column}}'
          - name: RATING_COLUMN
            value: '{{inputs.parameters.rating-column}}'
          - name: ITEM_ID_COLUMN_FEATURES
            value: '{{inputs.parameters.item-id-column-features}}'
          - name: ITEM_TEXT_COLUMN
            value: '{{inputs.parameters.item-text-column}}'
          - name: ALGORITHM
            value: '{{inputs.parameters.algorithm}}'
          - name: K
            value: '{{inputs.parameters.k}}'
          - name: HYPERPARAMETERS_JSON
            value: '{{inputs.parameters.hyperparameters-json}}'
          - name: MLFLOW_TRACKING_URI
            value: http://host.docker.internal:5000
          # mlflow-artifacts is now backed by real MinIO storage
          # (--no-serve-artifacts), so the training pod writes s3:// URIs
          # directly — see docker-compose.yml's mlflow service.
          - name: AWS_ACCESS_KEY_ID
            value: minioadmin
          - name: AWS_SECRET_ACCESS_KEY
            value: minioadmin
          - name: MLFLOW_S3_ENDPOINT_URL
            value: http://host.docker.internal:9000
        volumeMounts:
          - name: dataset
            mountPath: /mnt/data
            readOnly: true

    - name: register-step
      inputs:
        parameters:
          - name: model-name
          - name: task-type
          - name: artifact-uri
          - name: dataset-digest
      container:
        image: python:3.12-slim
        command: [sh, -c]
        env:
          # pip --user needs a writable, resolvable HOME (UID 1000 has none).
          - name: HOME
            value: /tmp
        args:
          - |
            set -euo pipefail
            pip install --user -q httpx

            MODEL_NAME='{{inputs.parameters.model-name}}'
            TASK_TYPE='{{inputs.parameters.task-type}}'
            ARTIFACT_URI='{{inputs.parameters.artifact-uri}}'
            DATASET_DIGEST='{{inputs.parameters.dataset-digest}}'
            export MODEL_NAME TASK_TYPE ARTIFACT_URI DATASET_DIGEST

            python3 <<'PY'
            import os
            import sys

            import httpx

            model_name = os.environ["MODEL_NAME"]
            task_type = os.environ["TASK_TYPE"]
            artifact_uri = os.environ["ARTIFACT_URI"]
            dataset_digest = os.environ.get("DATASET_DIGEST") or None

            # Business logic stays in orchestration-api, not here — CLAUDE.md convention.
            response = httpx.post(
                "http://host.docker.internal:8000/models/register",
                json={
                    "name": model_name,
                    "artifact_uri": artifact_uri,
                    "task_type": task_type,
                    "dataset_version": dataset_digest,
                },
                timeout=30.0,
            )
            if response.is_error:
                # Exit non-zero so Argo marks this step Failed, not silently succeeds.
                print(f"model registration failed: {response.status_code} {response.text}", file=sys.stderr)
                sys.exit(1)

            print(response.json())
            PY
        volumeMounts:
          - name: dataset
            mountPath: /mnt/data
            readOnly: true
