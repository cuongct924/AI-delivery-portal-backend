# Workaround for a controller-manager bug: a brand-new Project's
# DeploymentPipeline reconciler never fires, so this never gets created on
# its own. Mirrors telco-fraud-detection-development's ProjectReleaseBinding.
apiVersion: openchoreo.dev/v1alpha1
kind: ProjectReleaseBinding
metadata:
  name: platform-development
  namespace: default
  labels:
    openchoreo.dev/project: platform
    openchoreo.dev/environment: development
spec:
  environment: development
  owner:
    projectName: platform
  projectRelease: platform-6d675ddbf6
