# orchestration-api as a real OpenChoreo Component, deployed alongside the
# existing local dev process and docker-compose service (neither touched).
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: orchestration-api
  namespace: default
  labels:
    openchoreo.dev/project: platform
spec:
  owner:
    projectName: platform
  componentType:
    kind: ClusterComponentType
    name: deployment/service
  autoDeploy: true
  # Default 100m CPU starved the pod during its synchronous import of
  # mlflow+pandas+scipy+feast+kubernetes-client at startup.
  parameters:
    resources:
      requests:
        cpu: 500m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
