# Real image, not a placeholder. MLflow/Qdrant/LiteLLM stay on the host via
# docker-compose, reached via host.docker.internal. ANTHROPIC_API_KEY is
# omitted — not read eagerly at import time, so the container boots fine;
# only chat/portal_assistant need it added as a real Secret.
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: orchestration-api-workload
  namespace: default
  labels:
    openchoreo.dev/project: platform
    openchoreo.dev/component: orchestration-api
spec:
  owner:
    projectName: platform
    componentName: orchestration-api
  container:
    image: orchestration-api:openchoreo-local
    env:
      - key: AUTH_ENABLED
        value: "false"
      - key: MLFLOW_TRACKING_URI
        value: http://host.docker.internal:5000
      - key: LITELLM_GATEWAY_URL
        value: http://host.docker.internal:4000
      - key: QDRANT_URL
        value: http://host.docker.internal:6333
  endpoints:
    http:
      type: HTTP
      port: 8000
      visibility:
        - external
