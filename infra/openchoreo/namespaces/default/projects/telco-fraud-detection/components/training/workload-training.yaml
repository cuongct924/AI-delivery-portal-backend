# Same job the manual `curl` smoke test in this session already exercised:
# POST /trigger-training on the real orchestration-api (reachable from
# inside the k3d cluster via host.docker.internal), which delegates to
# OpenChoreoWorkflowAdapter (Golden Path #1 runs as an OpenChoreo
# WorkflowRun) exactly like any other Golden Path #1 caller — nothing
# MLOps-specific lives in this Component.
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: training-workload
  namespace: default
  labels:
    openchoreo.dev/project: telco-fraud-detection
    openchoreo.dev/component: training
spec:
  owner:
    projectName: telco-fraud-detection
    componentName: training
  container:
    image: curlimages/curl:8.11.1
    command: ["sh", "-c"]
    args:
      - >-
        curl -sS -f -X POST http://host.docker.internal:8000/trigger-training
        -H 'Content-Type: application/json'
        -d '{"model_name":"fraud-detection","dataset_uri":"file:///Users/cuongct090_04/Code/AI-delivery-portal/data/classification-telco-fraud-detection/telco-fraud-detection-sample.csv","task_type":"classification","algorithm":"RandomForestClassifier","target_column":"is_fraud","id_columns":["transaction_id"]}'
