# `container.image` is repurposed as the model's MLflow storageUri, not a
# real container image — see
# infra/openchoreo/platform-shared/component-types/clustercomponenttype-inference-service.yaml's
# header for why. "fraud-detection-demo" (an MLflow model name, out of
# scope for the telco-fraud-detection Project/Component rename — MLflow
# model names weren't touched) because that's the model actually
# registered in the real MLflow instance right now (`curl
# http://localhost:5000/api/2.0/mlflow/registered-models/search`) — no
# model is literally named "fraud-detection".
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: serving-workload
  namespace: default
  labels:
    openchoreo.dev/project: telco-fraud-detection
    openchoreo.dev/component: serving
spec:
  owner:
    projectName: telco-fraud-detection
    componentName: serving
  container:
    image: models:/fraud-detection-demo/1
