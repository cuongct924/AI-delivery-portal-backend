apiVersion: openchoreo.dev/v1alpha1
kind: Project
metadata:
  name: customer-support-ai
  namespace: default
  labels:
    openchoreo.dev/name: customer-support-ai
  annotations:
    openchoreo.dev/display-name: Customer Support AI
