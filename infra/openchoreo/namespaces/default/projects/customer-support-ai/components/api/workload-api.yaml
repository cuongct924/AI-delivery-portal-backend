apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: api-workload
  namespace: default
  labels:
    openchoreo.dev/project: customer-support-ai
    openchoreo.dev/component: api
spec:
  owner:
    projectName: customer-support-ai
    componentName: api
  container:
    image: customer-support-api:local
  endpoints:
    http:
      type: HTTP
      port: 8080
      visibility:
        - external
