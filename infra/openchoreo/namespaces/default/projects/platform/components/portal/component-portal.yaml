# Phase 2, sub-step 2.1 — portal (the Backstage frontend, repo
# cuongct924/AI-delivery-portal-frontend) as a ClusterComponentType "web-application".
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: portal
  namespace: default
  labels:
    openchoreo.dev/project: platform
spec:
  owner:
    projectName: platform
  componentType:
    kind: ClusterComponentType
    name: deployment/web-application
  autoDeploy: true
  # Default 100m CPU isn't enough for Backstage's synchronous plugin startup.
  parameters:
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
