# Uses app-config.production.yaml (OpenChoreo upstream's own config, not
# this fork's dev app-config.yaml) — no MLOps templates in its
# catalog.locations. Proves the Component/Deployment/Service/HTTPRoute
# plumbing; wiring in this fork's templates is separate follow-on work.
#
# Values copied from the already-running `backstage` Deployment in
# openchoreo-control-plane, simplified to guest mode and pointed at the
# real in-cluster openchoreo-api.
#
# BACKEND_SECRET references a Secret created out of band:
#   kubectl --context openchoreo-quick-start create secret generic portal-secrets \
#     -n dp-default-platform-development-8260e221 \
#     --from-literal=backend-secret="$(openssl rand -base64 32)"
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: portal-workload
  namespace: default
  labels:
    openchoreo.dev/project: platform
    openchoreo.dev/component: portal
spec:
  owner:
    projectName: platform
    componentName: portal
  container:
    image: portal:openchoreo-local
    env:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: PORT
        value: "7007"
      - key: DATABASE_CLIENT
        value: better-sqlite3
      # The distroless image can't create /app/.config/backstage itself
      # (no volumes field on Workload to mount an emptyDir there) — /tmp is
      # writable and just as ephemeral.
      - key: SQLITE_STORAGE_DIR
        value: /tmp/backstage
      - key: BACKSTAGE_BASE_URL
        value: http://development-default.openchoreoapis.localhost:19080/portal-http
      - key: OPENCHOREO_API_URL
        value: http://openchoreo-api.openchoreo-control-plane.svc.cluster.local:8080/api/v1
      - key: OPENCHOREO_FEATURES_AUTH_ENABLED
        value: "false"
      - key: BACKSTAGE_DANGEROUSLY_DISABLE_DEFAULT_AUTH_POLICY
        value: "true"
      - key: BACKSTAGE_GUEST_DANGEROUSLY_ALLOW_OUTSIDE_DEVELOPMENT
        value: "true"
      - key: OPENCHOREO_FEATURES_WORKFLOWS_ENABLED
        value: "true"
      - key: OPENCHOREO_FEATURES_OBSERVABILITY_ENABLED
        value: "true"
      - key: OPENCHOREO_FEATURES_AUTHZ_ENABLED
        value: "false"
      - key: OPENCHOREO_FEATURES_ASSISTANT_ENABLED
        value: "false"
      - key: OPENCHOREO_FEATURES_SECRET_MANAGEMENT_ENABLED
        value: "false"
      - key: OPENCHOREO_EVENTS_ENABLED
        value: "false"
      - key: OPENCHOREO_CATALOG_SYNC_FREQUENCY
        value: "300"
      - key: BACKEND_SECRET
        valueFrom:
          secretKeyRef:
            name: portal-secrets
            key: backend-secret
  endpoints:
    http:
      type: HTTP
      port: 7007
      visibility:
        - external
