# Real image, not a placeholder. MLflow/Qdrant/LiteLLM/Feast now run
# in-cluster on worker2 (infra/ai-platform-zone/, "AI Platform zone" —
# outside OpenChoreo), reached over normal in-cluster Service DNS instead of
# host.docker.internal (docker-compose retired — see CLAUDE.md). Thunder and
# the OpenChoreo API are likewise reached via their real in-cluster Service
# DNS now that this pod runs inside the same cluster, not the
# thunder.openchoreo.localhost/api.openchoreo.localhost host-gateway
# hostnames a docker-compose container on the host needed.
# ANTHROPIC_API_KEY is omitted — not read eagerly at import time, so the
# container boots fine; only chat/portal_assistant need it added as a real
# Secret.
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: orchestration-api-workload
  namespace: default
  labels:
    openchoreo.dev/project: platform
    openchoreo.dev/component: orchestration-api
spec:
  owner:
    projectName: platform
    componentName: orchestration-api
  container:
    image: orchestration-api:openchoreo-local
    env:
      - key: AUTH_ENABLED
        value: "false"
      - key: THUNDER_URL
        value: http://thunder-service.thunder.svc.cluster.local:8090
      - key: MLFLOW_TRACKING_URI
        value: http://mlflow.ai-platform-zone.svc.cluster.local:5000
      - key: LITELLM_GATEWAY_URL
        value: http://litellm.ai-platform-zone.svc.cluster.local:4000
      - key: QDRANT_URL
        value: http://qdrant.ai-platform-zone.svc.cluster.local:6333
      - key: MINIO_ENDPOINT_URL
        value: http://minio.ai-platform-zone.svc.cluster.local:9000
      - key: MLFLOW_S3_ENDPOINT_URL
        value: http://minio.ai-platform-zone.svc.cluster.local:9000
      # adapters/ai_platform/mlflow_adapter.py's register_model() calls
      # mlflow.register_model(), which lists the run's S3 artifacts directly
      # via boto3 — needs real credentials, not just MLFLOW_S3_ENDPOINT_URL.
      # Missing entirely from the old docker-compose env (same latent gap,
      # just never exercised there — this is the first time a real Golden
      # Path #1 run reached this call end-to-end). Same MinIO dev creds used
      # everywhere else in this repo, not a new secret.
      - key: AWS_ACCESS_KEY_ID
        value: minioadmin
      - key: AWS_SECRET_ACCESS_KEY
        value: minioadmin
      - key: FEAST_SERVING_URL
        value: http://feast-serve.ai-platform-zone.svc.cluster.local:6566
      # Backstage (separate frontend repo) still runs on the host machine —
      # out of scope for this redesign (CLAUDE.md: Portal frontend changes
      # happen in that repo). host.docker.internal resolves from inside a
      # k3d node's pods the same way it does for a docker-compose container.
      - key: BACKSTAGE_BASE_URL
        value: http://host.docker.internal:7007
      # Our identity when calling the golden-paths MCP servers — register by hand
      # in Thunder first.
      - key: MCP_CLIENT_ID
        value: orchestration-api-agent
      - key: MCP_CLIENT_SECRET
        value: orchestration-api-agent-dev-secret
      - key: OPENCHOREO_API_URL
        value: http://openchoreo-api.openchoreo-control-plane.svc.cluster.local:8080/api/v1
      # PrometheusDeliveryObserverAdapter's source for the real Delivery
      # Insights DORA tiles — same in-cluster Prometheus
      # ai-observability-server already queries (see its workload's
      # PROMETHEUS_URL). Without this, the adapter falls back to
      # localhost:9090, unreachable from this pod.
      - key: PROMETHEUS_URL
        value: http://prometheus-operated.openchoreo-observability-plane.svc.cluster.local:9090
      # Forced to Mock: the cluster's real Prometheus StatefulSet is
      # crash-looping on a broken upstream prometheus-config-reloader:v0.88.1
      # image (confirmed via manual testing — v0.86.0/v0.87.0/v0.89.0 all
      # run fine), and re-importing a fixed tag is currently blocked by a
      # separate Docker Desktop containerd-image-store bug breaking
      # `k3d image import` for any pulled (non-locally-built) image. Revert
      # once both are fixed — this only affects Delivery Insights, not
      # promotion/workflow/inference/model-registry (see adapters/factory.py:
      # USE_MOCK_ADAPTERS would have affected those too, this flag doesn't).
      - key: USE_MOCK_DELIVERY_OBSERVER
        value: "true"
      # MockDeliveryObserverAdapter's data source: "mock" (synthetic,
      # default) or "captured" (real runs from
      # scripts/capture-delivery-insights-runs.sh). See routers/delivery_insights.py.
      - key: MOCK_OBSERVER_DATA_SOURCE
        value: mock
  endpoints:
    http:
      type: HTTP
      port: 8000
      visibility:
        - external
