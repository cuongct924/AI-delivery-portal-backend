# agents/mcp-servers/mlops-golden-paths-server as a real OpenChoreo
# Component, pinned onto worker1 — see component-ai-observability-server.yaml.
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: mlops-golden-paths-server
  namespace: default
  labels:
    openchoreo.dev/project: platform
spec:
  owner:
    projectName: platform
  componentType:
    kind: ClusterComponentType
    name: deployment/pinned-service
  autoDeploy: true
  # Actual nodeSelector/tolerations/resources pin lives on
  # releasebinding-mlops-golden-paths-server-development.yaml — see
  # releasebinding-orchestration-api-development.yaml's comment for why
  # Component.spec.parameters doesn't work for this.
