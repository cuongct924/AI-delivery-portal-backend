# Registers the LiteLLM gateway running in ai-platform-zone on worker2
# (infra/k8s/ai-platform-zone/litellm.yaml, port 4000) as OpenChoreo
# Catalog metadata — does not change adapters/llm_gateway_adapter.py,
# does not change the port, does not deploy a second LiteLLM. Same
# in-cluster Service DNS already used by workload-orchestration-api.yaml's
# LITELLM_GATEWAY_URL.
apiVersion: openchoreo.dev/v1alpha1
kind: Resource
metadata:
  name: litellm
  namespace: default
  labels:
    openchoreo.dev/project: platform
spec:
  owner:
    projectName: platform
  type:
    kind: ClusterResourceType
    name: external-service
  parameters:
    url: http://litellm.ai-platform-zone.svc.cluster.local:4000
