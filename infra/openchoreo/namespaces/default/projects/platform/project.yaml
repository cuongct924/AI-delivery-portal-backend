# Holds the 2 core Portal services (orchestration-api, portal), as opposed
# to telco-fraud-detection/'s MLOps workload demo.
apiVersion: openchoreo.dev/v1alpha1
kind: Project
metadata:
  name: platform
  namespace: default
  labels:
    openchoreo.dev/name: platform
  annotations:
    openchoreo.dev/display-name: Platform
    openchoreo.dev/description: AI Delivery Portal's own services (orchestration-api, portal) — not an MLOps workload.
spec:
  type:
    kind: ClusterProjectType
    name: default
  deploymentPipelineRef:
    kind: DeploymentPipeline
    name: default
