# Workaround for the same controller-manager bug documented in
# infra/openchoreo/platform/projectreleasebinding-development.yaml: a
# brand-new Project's DeploymentPipeline reconciler never fires, so this
# never gets created on its own (verified again here — applying
# project.yaml alone left `kubectl get projectreleasebindings` with no
# telco-fraud-detection entry, only the auto-created ProjectRelease).
apiVersion: openchoreo.dev/v1alpha1
kind: ProjectReleaseBinding
metadata:
  name: telco-fraud-detection-development
  namespace: default
  labels:
    openchoreo.dev/project: telco-fraud-detection
    openchoreo.dev/environment: development
spec:
  environment: development
  owner:
    projectName: telco-fraud-detection
  projectRelease: telco-fraud-detection-6d675ddbf6
