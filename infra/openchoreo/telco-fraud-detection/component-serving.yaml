# Real KServe wiring (Phase 4 of docs/openchoreo-migration-next-steps.md):
# ClusterComponentType "proxy/inference-service"
# (infra/openchoreo/platform/clustercomponenttype-inference-service.yaml)
# renders a real serving.kserve.io/v1beta1 InferenceService, not a plain
# Deployment/Service — replaces
# infra/environments/*/inference-services/<tenant>/<model>.yaml's role.
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: telco-fraud-detection-serving
  namespace: default
  labels:
    openchoreo.dev/project: telco-fraud-detection
spec:
  owner:
    projectName: telco-fraud-detection
  componentType:
    kind: ClusterComponentType
    name: proxy/inference-service
  autoDeploy: true
