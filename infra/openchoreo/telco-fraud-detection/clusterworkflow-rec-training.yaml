# The "openchoreo" backend-mode counterpart to
# infra/argo-workflows/rec-train-register-template.yaml — referenced by
# adapters/openchoreo_workflow_adapter.py's trigger_workflow() via
# routers/recommendations.py's REC_TRAIN_REGISTER_TEMPLATE constant
# ("rec-train-register-golden-path"), so this ClusterWorkflow's `name` must
# match that constant exactly.
#
# Same camelCase rationale as clusterworkflow-training.yaml: CEL identifiers
# can't contain hyphens, so the adapter translates the hyphenated keys
# routers/recommendations.py builds (model-name, interactions-uri, ...) into
# these names before POSTing. Callers never see this detail.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterWorkflow
metadata:
  name: rec-train-register-golden-path
  annotations:
    openchoreo.dev/description: >-
      Golden Path #3 (Recommendation Train -> Track -> Register) — trains a
      recommender (svd/knn/tfidf_cosine) and registers it in MLflow. Wraps
      the same train-and-register DAG as "legacy" mode's Argo WorkflowTemplate;
      see infra/argo-workflows/rec-train-register-cluster-template.yaml.
spec:
  parameters:
    openAPIV3Schema:
      type: object
      required:
        [modelName, interactionsUri, userIdColumn, itemIdColumn, timestampColumn, algorithm]
      properties:
        modelName: {type: string}
        interactionsUri: {type: string}
        userIdColumn: {type: string}
        itemIdColumn: {type: string}
        timestampColumn: {type: string}
        algorithm: {type: string}
        k: {type: string, default: "10"}
        hyperparametersJson: {type: string, default: "{}"}
        ratingColumn: {type: string, default: ""}
        itemFeaturesUri: {type: string, default: ""}
        itemIdColumnFeatures: {type: string, default: ""}
        itemTextColumn: {type: string, default: ""}
  runTemplate:
    apiVersion: argoproj.io/v1alpha1
    kind: Workflow
    metadata:
      name: ${metadata.workflowRunName}
      namespace: ${metadata.namespace}
    spec:
      workflowTemplateRef:
        name: rec-train-register-golden-path-cluster
        clusterScope: true
      arguments:
        parameters:
          - name: model-name
            value: ${parameters.modelName}
          - name: interactions-uri
            value: ${parameters.interactionsUri}
          - name: user-id-column
            value: ${parameters.userIdColumn}
          - name: item-id-column
            value: ${parameters.itemIdColumn}
          - name: timestamp-column
            value: ${parameters.timestampColumn}
          - name: algorithm
            value: ${parameters.algorithm}
          - name: k
            value: ${parameters.k}
          - name: hyperparameters-json
            value: ${parameters.hyperparametersJson}
          - name: rating-column
            value: ${parameters.ratingColumn}
          - name: item-features-uri
            value: ${parameters.itemFeaturesUri}
          - name: item-id-column-features
            value: ${parameters.itemIdColumnFeatures}
          - name: item-text-column
            value: ${parameters.itemTextColumn}
  ttlAfterCompletion: 1d
