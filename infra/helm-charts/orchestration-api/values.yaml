image:
  repository: orchestration-api
  tag: local
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  port: 8000

# Mirrors docker-compose.yml, with service hostnames swapped for
# host.docker.internal — those still run via docker-compose, not in-cluster.
env:
  AUTH_ENABLED: "true"
  THUNDER_URL: http://thunder.openchoreo.localhost:8080
  MLFLOW_TRACKING_URI: http://host.docker.internal:5000
  LITELLM_GATEWAY_URL: http://host.docker.internal:4000
  QDRANT_URL: http://host.docker.internal:6333

# Real values passed at install time (--set secrets.anthropicApiKey=...
# or -f a gitignored values.local.yaml) — never commit real secrets here.
secrets:
  anthropicApiKey: ""
  litellmMasterKey: "sk-local-dev"
