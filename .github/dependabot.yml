version: 2
updates:
  # Python — each service resolves its own requirements.txt (see Makefile SERVICE_REQS).
  # NOTE: major bumps excluded — Dependabot edits *.lock.txt without re-resolving.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "pip"
    directory: "/adapters"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "pip"
    directory: "/services/orchestration-api"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "pip"
    directory: "/agents/mcp-servers/mlops-server"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "pip"
    directory: "/agents/mcp-servers/k8s-server"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "pip"
    directory: "/agents/mcp-servers/metrics-server"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Docker — base images in each Dockerfile, plus docker-compose.yml at root
  # (Dependabot's "docker" ecosystem covers both when directory is given).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/orchestration-api"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/agents/mcp-servers/mlops-server"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/agents/mcp-servers/k8s-server"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/agents/mcp-servers/metrics-server"
    schedule:
      interval: "weekly"

  # Actions used in .github/workflows/ci.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
