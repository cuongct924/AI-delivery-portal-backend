# CI pipeline for AI Delivery Portal.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Security — shift-left: secrets + IaC misconfig run early, fast, every push
  # ---------------------------------------------------------------------
  security-gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans git history, not just the working tree
      - run: docker run --rm -v "${{ github.workspace }}:/repo" -w /repo
          zricethezav/gitleaks:v8.30.1 detect --source . --redact -v

  security-checkov:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "${{ github.workspace }}:/repo" -w /repo
          bridgecrew/checkov:3.3.9 --directory . --framework dockerfile,argo_workflows,github_actions
          --skip-path .venv --compact --quiet

  # ---------------------------------------------------------------------
  # Python — ruff (lint + format), pyright (types), pytest (tests + coverage)
  # ---------------------------------------------------------------------
  python-checks:
    needs: [security-gitleaks, security-checkov]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # NOTE: plain ubuntu-latest, not a python:3.12-slim container — that
      # image's missing git/libatomic1 caused repeated CI failures.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        if: ${{ !env.ACT }}
        with:
          path: .cache/pip
          key: pip-${{ hashFiles('dev.lock.txt') }}
      # libatomic1: pyright's bundled Node.js needs it; not always preinstalled.
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libatomic1
      - run: |
          python3.12 -m venv .venv
          .venv/bin/pip install --upgrade pip -q
          .venv/bin/pip install -r dev.lock.txt -q
        env:
          PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
      # NOTE: catches lock files edited by hand instead of via `make lock`.
      - run: make lock
      - run: |
          if ! git diff --exit-code --quiet; then
            echo "::error::Lock files are out of date with their requirements.txt — run 'make lock' locally, review the diff, and commit the result."
            git diff --stat
            exit 1
          fi
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/pyright
      # tests/test_prompts_router.py needs a real MLflow reachable at
      # MLFLOW_TRACKING_URI (default http://localhost:5000, matched here) —
      # routers/prompts.py seeds its 2 default personas via
      # MlflowPromptRegistryAdapter at *import* time, before any test gets a
      # chance to mock it. Started as a plain `docker run`, not a `services:`
      # block — GitHub Actions service containers can't override the image's
      # command, and the official mlflow image needs `server --host ...` args
      # to actually run the tracking server instead of printing --help.
      - name: Start MLflow (tests/test_prompts_router.py needs a live registry)
        run: |
          docker run -d --name mlflow-test -p 5000:5000 ghcr.io/mlflow/mlflow:v3.15.1 \
            mlflow server --host 0.0.0.0 --port 5000
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:5000 && break
            sleep 1
          done
      # tests/test_qdrant_registry_adapter.py and tests/test_eval_sets_router.py
      # need a live Qdrant (QDRANT_URL, default http://localhost:6333) — the
      # RAG index version registry now lives there, next to the embeddings.
      - name: Start Qdrant (RAG index version registry)
        run: |
          docker run -d --name qdrant-test -p 6333:6333 qdrant/qdrant:v1.19.0
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:6333/collections && break
            sleep 1
          done
      - run: .venv/bin/pytest --cov-report=xml --junitxml=report.xml
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !env.ACT }}
        with:
          name: python-test-results
          path: |
            report.xml
            coverage.xml

  # Docker — build each service image with its own Dockerfile, then
  # Trivy-scan each. golden-path-guide-server predates this block and was
  # never added; not this change's concern to fix.
  # --ignore-unfixed: skip upstream CVEs with no available patch yet.
  # NOTE: the Portal frontend now lives in a separate repo
  # (cuongct924/AI-delivery-portal-frontend, forked from openchoreo/backstage-plugins)
  # and is built/checked there, not here.
  docker-build-and-scan:
    needs: [python-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Pinned release tarball, not `curl | sh` from a script URL.
      - name: Install Trivy
        run: curl -sSfL https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz | sudo tar -xz -C /usr/local/bin trivy
      - name: Set image tag vars
        run: |
          echo "SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_ENV"
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build images
        run: |
          docker build -t orchestration-api:$SHORT_SHA -f services/orchestration-api/Dockerfile .
          docker build -t ai-observability-server:$SHORT_SHA -f agents/mcp-servers/ai-observability-server/Dockerfile .
          docker build -t llmops-golden-paths-server:$SHORT_SHA -f agents/mcp-servers/llmops-golden-paths-server/Dockerfile .
          docker build -t mlops-golden-paths-server:$SHORT_SHA -f agents/mcp-servers/mlops-golden-paths-server/Dockerfile .
          docker build -t training-image:$SHORT_SHA -f infra/argo-workflows/training-image/Dockerfile .
      - name: Trivy scan
        run: |
          for img in orchestration-api ai-observability-server llmops-golden-paths-server mlops-golden-paths-server training-image; do
            echo "=== Trivy scan: $img ==="
            trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "$img:$SHORT_SHA"
          done
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push images
        if: github.ref == 'refs/heads/main'
        run: |
          for img in orchestration-api ai-observability-server llmops-golden-paths-server mlops-golden-paths-server training-image; do
            docker tag "$img:$SHORT_SHA" "ghcr.io/$REPO_LC/$img:$SHORT_SHA"
            docker tag "$img:$SHORT_SHA" "ghcr.io/$REPO_LC/$img:latest"
            docker push "ghcr.io/$REPO_LC/$img:$SHORT_SHA"
            docker push "ghcr.io/$REPO_LC/$img:latest"
          done
